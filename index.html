<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3;url=https://jeojeollo.com/">
  <title>저 절로 — 도량 주소 이전 안내</title>
  <meta name="description" content="저 절로 도량이 새 주소(https://jeojeollo.com)로 이전했습니다.">
  <link rel="canonical" href="https://jeojeollo.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="저 절로 — 도심속 쉼과 명상">
  <meta property="og:description" content="저 절로 도량이 새 주소(https://jeojeollo.com)로 이전했습니다.">
  <meta property="og:url" content="https://jeojeollo.com/">
  <meta property="og:image" content="https://jeojeollo.com/og-image.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #27211a 0%, #161310 60%, #0f0d0b 100%);
      color: #efe6d5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: min(92vw, 480px);
      padding: 40px 30px 34px;
      border-radius: 20px;
      background: rgba(34, 29, 24, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.28);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .lotus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      font-size: 28px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 1.28rem;
      line-height: 1.55;
      font-weight: 700;
      color: #f7eedc;
      word-break: keep-all;
    }
    .new-url {
      color: #e6c674;
      text-decoration: none;
      border-bottom: 1px solid rgba(230, 198, 116, 0.45);
    }
    .desc {
      margin: 0 0 26px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #cbbda6;
      word-break: keep-all;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #c9a14a 0%, #a98130 100%);
      color: #19140e;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    .count {
      margin: 16px 0 0;
      font-size: 0.85rem;
      color: #9e907a;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="lotus" aria-hidden="true">🪷</div>
    <h1>
      저 절로 도량이 새 주소(<a class="new-url" href="https://jeojeollo.com/">https://jeojeollo.com</a>)로 이전했습니다.
    </h1>
    <p class="desc">
      기존 방문 기록과 발원 공간이 새로운 도량으로 옮겨졌습니다.<br>
      잠시 후 새 도량으로 자동 안내해 드립니다.
    </p>
    <a class="btn" href="https://jeojeollo.com/">지금 바로 이동하기</a>
    <p class="count" id="countdown-text">3초 후 자동으로 이동합니다…</p>
  </main>

  <script>
    (function () {
      var target = 'https://jeojeollo.com/';
      var sec = 3;
      var el = document.getElementById('countdown-text');
      var timer = setInterval(function () {
        sec -= 1;
        if (sec > 0 && el) {
          el.textContent = sec + '초 후 자동으로 이동합니다…';
        } else {
          clearInterval(timer);
        }
      }, 1000);
      setTimeout(function () {
        window.location.replace(target);
      }, 3000);
    })();
  </script>
</body>
</html>
